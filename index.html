<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto-Scan Shiny Counter - Duration Mode</title>
    <!-- Include Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --shiny-accent: #ec4899;
            --shiny-glow: rgba(236, 72, 153, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d2d38;
            --success: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card.shiny-alert {
            border-color: var(--shiny-accent);
            box-shadow: 0 0 20px var(--shiny-glow);
            animation: pulseAlert 1.5s infinite alternate;
        }

        @keyframes pulseAlert {
            0% { border-color: var(--shiny-accent); }
            100% { border-color: #fde047; box-shadow: 0 0 30px rgba(253, 224, 71, 0.6); }
        }

        .camera-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center;
            transition: transform 0.1s ease-out;
        }

        .scan-box {
            position: absolute;
            width: 180px;
            height: 65px;
            border: 2px dashed var(--accent);
            background: rgba(245, 158, 11, 0.1);
            border-radius: 6px;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input[type="text"], input[type="range"] {
            background: #121214;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="range"] {
            accent-color: var(--accent);
            padding: 0;
            height: 30px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            background: #272730;
            color: var(--text-main);
        }

        .badge.active { background: var(--success); color: #000; }
        .badge.shiny { background: var(--shiny-accent); color: #fff; animation: pulseBadge 1s infinite alternate; }

        @keyframes pulseBadge {
            0% { opacity: 0.8; }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .counter-section {
            text-align: center;
        }

        .count-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: #272730;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button.primary {
            background-color: var(--accent);
            color: #121214;
            border: none;
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✨ 2-Second Text Duration Counter</h1>
    </header>

    <div class="card" id="mainCard">
        <div class="camera-container" id="cameraContainer">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="scan-box" id="scanBox">Drag over 3DS Text</div>
        </div>

        <div class="settings-grid">
            <div class="settings-row">
                <label for="triggerKeyword">Target Trigger Word / Text</label>
                <input type="text" id="triggerKeyword" value="Wild" placeholder="e.g. Wild, Encounter">
            </div>
            <div class="settings-row">
                <label for="zoomRange">Camera Zoom (<span id="zoomValue">1.0</span>x)</label>
                <input type="range" id="zoomRange" min="1" max="4" step="0.1" value="1" oninput="updateZoom()">
            </div>
        </div>
        
        <div class="status-bar">
            <span>Status:</span>
            <span class="badge" id="scannerStatus">Ready</span>
        </div>

        <div class="btn-group" style="margin-top: 10px;">
            <button onclick="startCamera()">Start Camera</button>
            <button onclick="toggleAutoScan()" id="scanBtn" style="border-color: var(--accent);">Enable Text Scan</button>
        </div>
    </div>

    <!-- Counter Card -->
    <div class="card counter-section">
        <div style="font-size: 0.9rem; color: var(--text-muted);">Encounters Tracked</div>
        <div class="count-display" id="countDisplay">0</div>
        
        <div class="btn-group">
            <button onclick="adjustCount(-1)">- Decrement</button>
            <button onclick="resetCount()">Reset</button>
            <button class="primary" onclick="adjustCount(1)">+ Manual Count</button>
        </div>
    </div>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    let currentCount = localStorage.getItem('shiny_count') ? parseInt(localStorage.getItem('shiny_count')) : 0;
    let isScanning = false;
    let scanInterval = null;
    let videoStream = null;
    let worker = null;

    // State tracking for text duration on screen
    let textFirstSeenTimestamp = null;
    let shinyFlaggedForCurrentEncounter = false;

    const videoElement = document.getElementById('webcam');
    const scannerStatus = document.getElementById('scannerStatus');
    const scanBox = document.getElementById('scanBox');
    const container = document.getElementById('cameraContainer');
    const zoomRange = document.getElementById('zoomRange');
    const zoomValue = document.getElementById('zoomValue');
    const triggerKeywordInput = document.getElementById('triggerKeyword');
    const mainCard = document.getElementById('mainCard');

    let isDragging = false;
    let startX, startY, initialX = 20, initialY = 120;

    scanBox.style.left = initialX + 'px';
    scanBox.style.top = initialY + 'px';

    function dragStart(e) {
        isDragging = true;
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;
        startX = clientX - scanBox.offsetLeft;
        startY = clientY - scanBox.offsetTop;
    }

    function drag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;
        
        let newX = clientX - startX;
        let newY = clientY - startY;

        newX = Math.max(0, Math.min(newX, container.clientWidth - scanBox.clientWidth));
        newY = Math.max(0, Math.min(newY, container.clientHeight - scanBox.clientHeight));

        scanBox.style.left = newX + 'px';
        scanBox.style.top = newY + 'px';
    }

    function dragEnd() {
        isDragging = false;
    }

    scanBox.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);

    scanBox.addEventListener('touchstart', dragStart);
    document.addEventListener('touchmove', drag, { passive: false });
    document.addEventListener('touchend', dragEnd);

    function updateZoom() {
        const val = zoomRange.value;
        zoomValue.innerText = parseFloat(val).toFixed(1);
        videoElement.style.transform = `scale(${val})`;
    }

    async function startCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            videoElement.srcObject = videoStream;
            scannerStatus.innerText = "Camera Active";
        } catch (err) {
            alert("Camera error: " + err.message);
        }
    }

    async function initWorker() {
        if (!worker) {
            scannerStatus.innerText = "Loading OCR Engine...";
            worker = await Tesseract.createWorker('eng');
            scannerStatus.innerText = "Engine Ready";
        }
    }

    async function toggleAutoScan() {
        isScanning = !isScanning;
        const btn = document.getElementById('scanBtn');

        if (isScanning) {
            if (!videoElement.srcObject) {
                alert("Please start the camera first!");
                isScanning = false;
                return;
            }
            btn.style.background = "var(--success)";
            btn.style.color = "#000";
            btn.innerText = "Scanning Active...";
            scannerStatus.className = "badge active";
            mainCard.classList.remove('shiny-alert');
            textFirstSeenTimestamp = null;
            shinyFlaggedForCurrentEncounter = false;

            await initWorker();

            // Run OCR check every 1.2 seconds for smooth duration tracking
            scanInterval = setInterval(checkFrameText, 1200);
        } else {
            btn.style.background = "#272730";
            btn.style.color = "var(--text-main)";
            btn.innerText = "Enable Text Scan";
            scannerStatus.className = "badge";
            scannerStatus.innerText = "Paused";
            clearInterval(scanInterval);
        }
    }

    async function checkFrameText() {
        if (!isScanning || !videoElement.srcObject) return;

        const canvas = document.getElementById('snapshotCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = videoElement.videoWidth || 1280;
        canvas.height = videoElement.videoHeight || 720;
        
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

        const scaleX = canvas.width / container.clientWidth;
        const scaleY = canvas.height / container.clientHeight;

        const boxX = scanBox.offsetLeft * scaleX;
        const boxY = scanBox.offsetTop * scaleY;
        const boxW = scanBox.clientWidth * scaleX;
        const boxH = scanBox.clientHeight * scaleY;

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = boxW * 2;
        cropCanvas.height = boxH * 2;
        const cropCtx = cropCanvas.getContext('2d');
        
        cropCtx.filter = 'grayscale(100%) contrast(200%) brightness(110%)';
        cropCtx.drawImage(canvas, boxX, boxY, boxW, boxH, 0, 0, cropCanvas.width, cropCanvas.height);

        scannerStatus.innerText = "Scanning...";

        try {
            const { data: { text } } = await worker.recognize(cropCanvas);
            const cleanText = text.toLowerCase().replace(/[^a-z0-9\s]/gi, '');
            const targetWord = triggerKeywordInput.value.trim().toLowerCase();
            const now = Date.now();

            if (targetWord && cleanText.includes(targetWord)) {
                // Text is visible in the frame!
                if (!textFirstSeenTimestamp) {
                    // First time seeing the keyword for this encounter
                    textFirstSeenTimestamp = now;
                    adjustCount(1); // Log the encounter immediately
                    scannerStatus.className = "badge active";
                    scannerStatus.innerText = `Encounter detected! Watching duration...`;
                } else {
                    // Text is still on screen. Check how long it's been there.
                    const durationOnScreen = now - textFirstSeenTimestamp;

                    if (durationOnScreen >= 2000 && !shinyFlaggedForCurrentEncounter) {
                        // It has stayed on screen >= 2 seconds! Flag as Shiny!
                        shinyFlaggedForCurrentEncounter = true;
                        scannerStatus.className = "badge shiny";
                        scannerStatus.innerText = `✨ SHINY DETECTED! ( > 2s duration )`;
                        mainCard.classList.add('shiny-alert');

                        if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 500]);

                        // Pause scanning to give user time to handle the encounter
                        toggleAutoScan();
                        setTimeout(() => { if (!isScanning) toggleAutoScan(); }, 8000);
                    } else if (!shinyFlaggedForCurrentEncounter) {
                        scannerStatus.innerText = `Text on screen... (${(durationOnScreen/1000).toFixed(1)}s)`;
                    }
                }
            } else {
                // Text has disappeared or isn't there yet — reset timer for next encounter
                if (textFirstSeenTimestamp && !shinyFlaggedForCurrentEncounter) {
                    scannerStatus.innerText = `Encounter logged. Waiting for next...`;
                }
                textFirstSeenTimestamp = null;
                shinyFlaggedForCurrentEncounter = false;
            }
        } catch (err) {
            console.error(err);
            scannerStatus.innerText = "Scan Retry...";
        }
    }

    function adjustCount(amount) {
        currentCount = Math.max(0, currentCount + amount);
        document.getElementById('countDisplay').innerText = currentCount.toLocaleString();
        localStorage.setItem('shiny_count', currentCount);
    }

    function resetCount() {
        if (confirm("Reset counter?")) {
            currentCount = 0;
            adjustCount(0);
            mainCard.classList.remove('shiny-alert');
        }
    }

    adjustCount(0);
    startCamera();
</script>

</body>
</html>
