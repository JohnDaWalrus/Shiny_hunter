<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto-Scan Shiny Counter</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d2d38;
            --success: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .camera-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-reticle {
            position: absolute;
            width: 70%;
            height: 45px;
            border: 2px dashed var(--accent);
            background: rgba(245, 158, 11, 0.05);
            pointer-events: none;
            border-radius: 6px;
        }

        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="text"] {
            background: #121214;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            background: #272730;
            color: var(--text-main);
        }

        .badge.active { background: var(--success); color: #000; }

        .counter-section {
            text-align: center;
        }

        .count-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: #272730;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button.primary {
            background-color: var(--accent);
            color: #121214;
            border: none;
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✨ Auto-Scan Shiny Counter</h1>
    </header>

    <!-- Camera Viewfinder & Customization Card -->
    <div class="card">
        <div class="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="scan-reticle"></div>
        </div>

        <div class="settings-row">
            <label for="triggerInput">Scan Trigger Keyword / Threshold</label>
            <input type="text" id="triggerInput" value="Wild" placeholder="e.g. Wild, Encounter, Battle">
        </div>
        
        <div class="status-bar">
            <span>Status:</span>
            <span class="badge" id="scannerStatus">Ready</span>
        </div>

        <div class="btn-group" style="margin-top: 12px;">
            <button onclick="startCamera()">Start Camera</button>
            <button onclick="toggleAutoScan()" id="scanBtn" style="border-color: var(--accent);">Enable Auto-Scan</button>
        </div>
    </div>

    <!-- Counter Card -->
    <div class="card counter-section">
        <div style="font-size: 0.9rem; color: var(--text-muted);">Encounters Tracked</div>
        <div class="count-display" id="countDisplay">0</div>
        
        <div class="btn-group">
            <button onclick="adjustCount(-1)">- Decrement</button>
            <button onclick="resetCount()">Reset</button>
            <button class="primary" onclick="adjustCount(1)">+ Manual Count</button>
        </div>
    </div>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    let currentCount = localStorage.getItem('shiny_count') ? parseInt(localStorage.getItem('shiny_count')) : 0;
    let isScanning = false;
    let scanInterval = null;
    let videoStream = null;

    const videoElement = document.getElementById('webcam');
    const scannerStatus = document.getElementById('scannerStatus');
    const triggerInput = document.getElementById('triggerInput');

    async function startCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' } 
            });
            videoElement.srcObject = videoStream;
            scannerStatus.innerText = "Camera Active";
        } catch (err) {
            alert("Camera error: " + err.message);
        }
    }

    function toggleAutoScan() {
        isScanning = !isScanning;
        const btn = document.getElementById('scanBtn');

        if (isScanning) {
            if (!videoElement.srcObject) {
                alert("Please start the camera first!");
                isScanning = false;
                return;
            }
            btn.style.background = "var(--success)";
            btn.style.color = "#000";
            btn.innerText = "Scanning Active...";
            scannerStatus.innerText = `Scanning for: "${triggerInput.value}"`;
            scannerStatus.className = "badge active";

            scanInterval = setInterval(checkFrame, 400);
        } else {
            btn.style.background = "#272730";
            btn.style.color = "var(--text-main)";
            btn.innerText = "Enable Auto-Scan";
            scannerStatus.className = "badge";
            scannerStatus.innerText = "Paused";
            clearInterval(scanInterval);
        }
    }

    function checkFrame() {
        if (!isScanning || !videoElement.srcObject) return;

        const canvas = document.getElementById('snapshotCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = videoElement.videoWidth || 320;
        canvas.height = videoElement.videoHeight || 240;
        
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

        const boxWidth = canvas.width * 0.7;
        const boxHeight = 45;
        const startX = (canvas.width - boxWidth) / 2;
        const startY = (canvas.height * 0.65);

        const frameData = ctx.getImageData(startX, startY, boxWidth, boxHeight);
        let totalBrightness = 0;
        const pixelCount = frameData.data.length / 4;

        for (let i = 0; i < frameData.data.length; i += 4) {
            totalBrightness += (frameData.data[i] * 0.299 + frameData.data[i+1] * 0.587 + frameData.data[i+2] * 0.114);
        }

        const avgBrightness = totalBrightness / pixelCount;
        const keyword = triggerInput.value.trim().toLowerCase();

        // Dynamic threshold adjustment based on user input intent or brightness shift
        const triggerThreshold = keyword.length > 0 ? 170 : 170;

        if (avgBrightness > triggerThreshold) {
            adjustCount(1);
            scannerStatus.innerText = `Trigger Found! (+1)`;
            
            toggleAutoScan();
            setTimeout(() => { if (!isScanning) toggleAutoScan(); }, 5000);
        }
    }

    function adjustCount(amount) {
        currentCount = Math.max(0, currentCount + amount);
        document.getElementById('countDisplay').innerText = currentCount.toLocaleString();
        localStorage.setItem('shiny_count', currentCount);
    }

    function resetCount() {
        if (confirm("Reset counter?")) {
            currentCount = 0;
            adjustCount(0);
        }
    }

    adjustCount(0);
    startCamera();
</script>

</body>
</html>
