<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OCR Auto Shiny Counter</title>
    <!-- Include Tesseract.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d2d38;
            --success: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .camera-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Target box indicator overlay */
        .scan-box {
            position: absolute;
            width: 80%;
            height: 60px;
            border: 2px dashed var(--accent);
            background: rgba(245, 158, 11, 0.05);
            pointer-events: none;
            border-radius: 4px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            background: #272730;
            color: var(--text-main);
        }

        .badge.scanning { background: var(--success); color: #000; }

        .counter-section {
            text-align: center;
        }

        .count-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: #272730;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button.primary {
            background-color: var(--accent);
            color: #121214;
            border: none;
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✨ OCR Text Shiny Counter</h1>
    </header>

    <!-- Camera Viewfinder & OCR Card -->
    <div class="card">
        <div class="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="scan-box"></div>
        </div>
        
        <div class="status-bar">
            <span>OCR Status:</span>
            <span class="badge" id="ocrStatus">Ready</span>
        </div>

        <div class="btn-group" style="margin-top: 10px;">
            <button onclick="startCamera()">Start Camera</button>
            <button onclick="toggleOCRScan()" id="ocrBtn" style="border-color: var(--accent);">Enable Text Scan</button>
        </div>
    </div>

    <!-- Counter Card -->
    <div class="card counter-section">
        <div style="font-size: 0.9rem; color: var(--text-muted);">Encounters Tracked</div>
        <div class="count-display" id="countDisplay">0</div>
        
        <div class="btn-group">
            <button onclick="adjustCount(-1)">- Decrement</button>
            <button onclick="resetCount()">Reset</button>
            <button class="primary" onclick="adjustCount(1)">+ Manual Count</button>
        </div>
    </div>
</div>

<!-- Hidden canvas for image snapping -->
<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
    let currentCount = localStorage.getItem('shiny_count') ? parseInt(localStorage.getItem('shiny_count')) : 0;
    let isScanning = false;
    let scanInterval = null;
    let videoStream = null;
    let worker = null;

    const videoElement = document.getElementById('webcam');
    const ocrStatus = document.getElementById('ocrStatus');

    async function startCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' } 
            });
            videoElement.srcObject = videoStream;
            ocrStatus.innerText = "Camera Active";
        } catch (err) {
            alert("Camera error: " + err.message);
        }
    }

    async function initWorker() {
        if (!worker) {
            ocrStatus.innerText = "Loading OCR Engine...";
            worker = await Tesseract.createWorker('eng');
            ocrStatus.innerText = "Engine Ready";
        }
    }

    async function toggleOCRScan() {
        isScanning = !isScanning;
        const btn = document.getElementById('ocrBtn');

        if (isScanning) {
            if (!videoElement.srcObject) {
                alert("Please start the camera first!");
                isScanning = false;
                return;
            }
            btn.style.background = "var(--success)";
            btn.style.color = "#000";
            btn.innerText = "Stop Text Scan";
            ocrStatus.className = "badge scanning";
            
            await initWorker();
            
            // Scan every 4 seconds to allow processing time on mobile CPUs
            scanInterval = setInterval(runOCR, 4000);
        } else {
            btn.style.background = "#272730";
            btn.style.color = "var(--text-main)";
            btn.innerText = "Enable Text Scan";
            ocrStatus.className = "badge";
            ocrStatus.innerText = "Paused";
            clearInterval(scanInterval);
        }
    }

    async function runOCR() {
        if (!isScanning || !videoElement.srcObject) return;

        const canvas = document.getElementById('snapshotCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = videoElement.videoWidth || 640;
        canvas.height = videoElement.videoHeight || 480;
        
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

        ocrStatus.innerText = "Scanning text...";

        try {
            // Process snapshot frame via Tesseract OCR worker
            const { data: { text } } = await worker.recognize(canvas);
            const cleanText = text.toLowerCase();
            
            console.log("OCR Read:", cleanText);

            // Trigger words to look for on your 3DS screen text box
            if (cleanText.includes('wild') || cleanText.includes('encounter') || cleanText.includes('battle')) {
                adjustCount(1);
                ocrStatus.innerText = "Encounter Found! (+1)";
                
                // Pause scanning for 6 seconds so it doesn't double-count the same message box
                toggleOCRScan();
                setTimeout(() => { if(!isScanning) toggleOCRScan(); }, 6000);
            } else {
                ocrStatus.innerText = "Listening for text...";
            }
        } catch (err) {
            console.error(err);
            ocrStatus.innerText = "Scan Retry...";
        }
    }

    function adjustCount(amount) {
        currentCount = Math.max(0, currentCount + amount);
        document.getElementById('countDisplay').innerText = currentCount.toLocaleString();
        localStorage.setItem('shiny_count', currentCount);
    }

    function resetCount() {
        if (confirm("Reset counter?")) {
            currentCount = 0;
            adjustCount(0);
        }
    }

    adjustCount(0);
    startCamera();
</script>

</body>
</html>
